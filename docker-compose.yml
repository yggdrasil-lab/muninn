version: "3.8"

networks:
  aether-net:
    external: true
  internal:
    driver: overlay
    attachable: true

services:
  wiki:
    image: ${REGISTRY_PREFIX}/muninn:latest
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.muninn.rule=Host(`wiki.${DOMAIN_NAME}`)"
        - "traefik.http.routers.muninn.entrypoints=websecure"
        - "traefik.http.routers.muninn.tls.certresolver=cloudflare"
        - "traefik.http.services.muninn.loadbalancer.server.port=8080"
    volumes:
      # Mount the content from Atlas/Muninn
      - ${OBSIDIAN_VAULT_PATH}/second-brain/Atlas/Muninn:/quartz/content
    environment:
      - QUARTZ_content=/quartz/content
      # Prevent build loops
      - CI=true
    networks:
      - aether-net
      - internal
